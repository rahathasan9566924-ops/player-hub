<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Player Hub (Prototype)</title>
<style>
  :root{
    --bg:#0f1218; --panel:#171c26; --panel2:#1f2632; --line:#2a3342;
    --text:#e8ecf3; --muted:#8b95a7; --accent:#38d6a4; --accent2:#ff7a59;
    --gold:#f2c14e; --blue:#4aa8ff; --red:#ff5d6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:70px}
  header{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px}
  header h1{font-size:18px;flex:1}
  .back{background:none;border:0;color:var(--text);font-size:20px;cursor:pointer;display:none}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{background:var(--panel);border:0;color:var(--muted);padding:6px 10px;font-size:13px;cursor:pointer}
  .lang button.on{background:var(--accent);color:#06130e;font-weight:700}
  .search{padding:12px 16px}
  .search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:15px;outline:none}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px 12px}
  .chip{flex:none;padding:6px 12px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-size:13px;cursor:pointer}
  .chip.on{background:var(--accent);color:#06130e;border-color:var(--accent);font-weight:600}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:0 16px}
  @media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
  .card{background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;position:relative}
  .card .ovr{font-size:28px;font-weight:800;color:var(--gold);line-height:1}
  .card .pos{font-size:12px;color:var(--muted);margin-top:2px}
  .card .name{margin-top:18px;font-weight:600;font-size:15px}
  .card .club{font-size:12px;color:var(--muted)}
  .tier{position:absolute;top:10px;right:10px;font-size:11px;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--text)}
  .section-title{padding:18px 16px 10px;font-size:14px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .empty{padding:40px 16px;text-align:center;color:var(--muted)}

  #detail{display:none}
  .hero{display:flex;gap:16px;padding:16px;align-items:center;background:linear-gradient(180deg,#1b2638,var(--bg))}
  .hero .big{width:110px;height:150px;border-radius:14px;background:linear-gradient(160deg,#2c3b56,#131a26);border:2px solid var(--gold);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none}
  .hero .big b{font-size:44px;color:var(--gold);line-height:1}
  .hero .big span{font-size:13px;color:var(--muted)}
  .hero h2{font-size:22px}
  .hero p{color:var(--muted);font-size:13px;margin-top:4px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 16px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
  .stat b{display:block;font-size:16px}
  .stat span{font-size:11px;color:var(--muted)}
  .tabs{display:flex;border-bottom:1px solid var(--line);margin-top:16px;overflow-x:auto}
  .tab{flex:none;padding:12px 14px;color:var(--muted);font-size:14px;cursor:pointer;border-bottom:2px solid transparent}
  .tab.on{color:var(--accent);border-color:var(--accent)}
  .pane{padding:14px 16px}
  .attr-group{margin-bottom:16px}
  .attr-group h3{font-size:13px;color:var(--muted);margin-bottom:8px}
  .attr{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:14px}
  .attr .lab{flex:1}
  .bar{width:110px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .val{width:30px;text-align:right;font-weight:700}
  .skills{display:flex;flex-wrap:wrap;gap:8px}
  .skill{padding:8px 12px;border-radius:10px;background:var(--panel);border:1px solid var(--line);font-size:13px}
  .skill.gold{border-color:var(--gold);color:var(--gold)}
  .pos-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .pcell{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center;font-size:13px}
  .pcell b{display:block;font-size:18px;margin-top:4px}
  .build{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .build .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .build h4{font-size:15px}
  .build small{color:var(--muted)}
  .vote{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:6px 10px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap}
  .vote.on{background:var(--accent2);border-color:var(--accent2)}
  .btn{width:100%;margin-top:10px;padding:12px;border-radius:12px;border:0;background:var(--accent);color:#06130e;font-weight:700;font-size:15px;cursor:pointer}
  .btn.ghost{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  .compare-bar{position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px;display:none;align-items:center;gap:10px;z-index:20}
  .compare-bar span{flex:1;font-size:13px;color:var(--muted)}
  .compare-bar button{padding:10px 14px;border-radius:10px;border:0;background:var(--accent);color:#06130e;font-weight:700;cursor:pointer}
  .cmp{width:100%;border-collapse:collapse;font-size:14px}
  .cmp td,.cmp th{padding:10px 6px;border-bottom:1px solid var(--line);text-align:center}
  .cmp th:first-child,.cmp td:first-child{text-align:left;color:var(--muted)}
  .note{font-size:12px;color:var(--muted);padding:10px 16px}
  .cardcmp{font-size:12px;color:var(--muted);margin-top:8px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<header>
  <button class="back" id="backBtn" aria-label="Back">←</button>
  <h1 id="title">Player Hub</h1>
  <div class="lang" role="group" aria-label="Language">
    <button data-lang="en" class="on">EN</button>
    <button data-lang="bn">বাংলা</button>
  </div>
</header>

<!-- LIST VIEW -->
<section id="list">
  <div style="padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line)">
    <details id="dbSettings"><summary style="cursor:pointer;color:var(--accent);font-weight:600">Connect Player Database / ডেটাবেইস সংযোগ</summary>
      <div style="display:grid;gap:8px;padding-top:12px">
        <input id="sbUrl" type="url" placeholder="Supabase Project URL" autocomplete="url" style="padding:10px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--line)">
        <input id="sbKey" type="password" placeholder="Publishable key (or legacy anon key)" autocomplete="off" style="padding:10px;border-radius:8px;background:var(--bg);color:var(--text);border:1px solid var(--line)">
        <button class="btn" id="connectDb" style="margin:0">Connect Database</button>
        <small id="dbStatus" role="status" style="color:var(--muted)">Demo records are shown until a database is connected. Never enter a service-role/secret key.</small>
      </div>
    </details>
  </div>
  <div style="display:flex;gap:8px;padding:12px 16px"><button class="btn" id="playersTab" style="margin:0">Players</button><button class="btn" id="managersTab" style="margin:0">Managers</button></div>
  <div id="playerContent">
  <div class="search"><input id="q" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div class="section-title" id="allTitle"></div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" style="display:none"></div>
  </div>
  <div id="managerContent" style="display:none;padding:16px"><div id="managerGrid" class="grid"></div><div id="managerEmpty" class="empty" style="display:none">No published managers found.</div></div>
</section>

<!-- DETAIL VIEW -->
<section id="detail">
  <div class="hero">
    <div class="big"><b id="dOvr">0</b><span id="dPos">POS</span></div>
    <div>
      <h2 id="dName"></h2>
      <p id="dClub"></p>
      <p id="dPlaystyle"></p>
    </div>
  </div>
  <div class="stats">
    <div class="stat"><b id="sH"></b><span data-i18n="height"></span></div>
    <div class="stat"><b id="sW"></b><span data-i18n="weight"></span></div>
    <div class="stat"><b id="sA"></b><span data-i18n="age"></span></div>
    <div class="stat"><b id="sF"></b><span data-i18n="foot"></span></div>
  </div>
  <div class="tabs" id="tabs">
    <div class="tab on" data-t="ov" data-i18n="tabOverview"></div>
    <div class="tab" data-t="at" data-i18n="tabAttributes"></div>
    <div class="tab" data-t="sk" data-i18n="tabSkills"></div>
    <div class="tab" data-t="ps" data-i18n="tabPositions"></div>
    <div class="tab" data-t="bd" data-i18n="tabBuilds"></div>
  </div>

  <div class="pane" id="p-ov"></div>
  <div class="pane" id="p-at" style="display:none"></div>
  <div class="pane" id="p-sk" style="display:none"></div>
  <div class="pane" id="p-ps" style="display:none"></div>
  <div class="pane" id="p-bd" style="display:none"></div>
</section>

<!-- Compare -->
<section id="compareView" style="display:none">
  <div class="section-title" data-i18n="compareTitle"></div>
  <div class="pane"><table class="cmp" id="cmpTable"></table></div>
  <div style="padding:0 16px"><button class="btn ghost" id="closeCmp" data-i18n="close"></button></div>
</section>

<div class="compare-bar" id="cbar">
  <span id="cText"></span>
  <button id="cGo" data-i18n="compareBtn"></button>
</div>

  "Speed":"গতি","Acceleration":"ত্বরণ","Kicking Power":"শট জোর","Jumping":"লাফ","Physical Contact":"শারীরিক সংঘর্ষ","Balance":"ভারসাম্য","Stamina":"স্ট্যামিনা",
  "Defensive Awareness":"রক্ষণ-বোধ","Tackling":"ট্যাকলিং","Aggression":"আগ্রাসন","Defensive Engagement":"রক্ষণে যোগ",
  "GK Awareness":"গোলরক্ষক-বোধ","GK Catching":"ক্যাচিং","GK Deflecting":"ডিফ্লেক্টিং","GK Reflexes":"রিফ্লেক্স"
};

// ---- State ----
let lang = "en";
let filter = "ALL", query = "", current = null, compare = new Set(), votes = {}, tab = "ov";

// ---- Helpers ----
const $ = id => document.getElementById(id);
const t = k => T[lang][k];
const barColor = v => v>=85?"var(--accent)":v>=70?"#f2c14e":"var(--red)";
const txt = (obj) => typeof obj==="string" ? obj : (obj[lang] || obj.en);
const attrLabel = k => lang==="bn" ? (ATTR_BN[k]||k) : k;
const posLabel = p => p==="ALL" ? (lang==="bn"?"সব":"All") : p;

function applyStatic(){
  document.documentElement.lang = lang;
  $("q").placeholder = t("search");
  $("allTitle").textContent = t("allPlayers");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if(T[lang][key] && typeof T[lang][key] === "string") el.textContent = T[lang][key];
  });
  document.querySelectorAll(".lang button").forEach(b => b.classList.toggle("on", b.dataset.lang===lang));
  $("cGo").textContent = t("compareBtn");
  $("closeCmp").textContent = t("close");
  document.querySelectorAll("#tabs .tab").forEach(el => el.textContent = t(el.dataset.i18n));
  $("title").textContent = current && $("detail").style.display==="block" ? current.name : (screenIsCompare() ? t("compareTitle") : "Player Hub");
  renderChips(); renderGrid(); updateCompareBar();
  if($("detail").style.display==="block" && current) { openPlayer(current.id, true); }
}
function screenIsCompare(){ return $("compareView").style.display==="block"; }

function renderChips(){
  $("chips").innerHTML = POS_FILTERS.map(p =>
    `<div class="chip ${p===filter?'on':''}" data-p="${p}">${posLabel(p)}</div>`).join("");
  document.querySelectorAll(".chip").forEach(c => c.onclick = () => { filter = c.dataset.p; renderChips(); renderGrid(); });
}

function renderGrid(){
  const list = PLAYERS.filter(p =>
    (filter==="ALL" || p.pos===filter) &&
    p.name.toLowerCase().includes(query.toLowerCase()));
  $("grid").innerHTML = list.map(p => `
    <div class="card" data-id="${p.id}">
      <span class="tier">${p.tier}</span>
      <div class="ovr">${p.ovr??"—"}</div>
      <div class="pos">${p.pos}</div>
      <div class="name">${p.name}</div>
      <div class="club">${p.club}</div>
      <div class="cardcmp"><label><input type="checkbox" data-cmp="${p.id}" ${compare.has(p.id)?'checked':''}> ${lang==="bn"?"তুলনায় যোগ":"Compare"}</label></div>
    </div>`).join("");
  $("empty").textContent = t("noResults");
  $("empty").style.display = list.length ? "none" : "block";
  $("grid").querySelectorAll(".card").forEach(c => c.onclick = e => {
    if(e.target.dataset.cmp) return;
    openPlayer(+c.dataset.id);
  });
  document.querySelectorAll("[data-cmp]").forEach(cb => cb.onchange = () => {
    const id = +cb.dataset.cmp;
    if(cb.checked){ if(compare.size>=3){ cb.checked=false; alert(t("maxThree")); return; } compare.add(id); }
    else compare.delete(id);
    updateCompareBar();
  });
}

function updateCompareBar(){
  $("cbar").style.display = compare.size && !screenIsCompare() ? "flex" : "none";
  $("cText").textContent = t("selected")(compare.size);
}

function showList(){
  $("list").style.display="block"; $("detail").style.display="none"; $("compareView").style.display="none"; showPlayersTab();
  $("backBtn").style.display="none"; $("title").textContent="Player Hub";
  current = null;
  renderGrid(); updateCompareBar();
}

function openPlayer(id, keepTab){
  current = PLAYERS.find(p=>p.id===id);
  $("list").style.display="none"; $("detail").style.display="block"; $("compareView").style.display="none";
  $("backBtn").style.display="inline"; $("title").textContent=current.name;
  $("dOvr").textContent=current.ovr??"—"; $("dPos").textContent=current.pos;
  $("dName").textContent=current.name; $("dClub").textContent=current.club;
  $("dPlaystyle").textContent=current.playstyle;
  $("sH").textContent=current.h?current.h+" "+t("cm"):"—";
  $("sW").textContent=current.w?current.w+" "+t("kg"):"—";
  $("sA").textContent=current.age?current.age+" "+t("yrs"):"—";
  $("sF").textContent= current.foot==="L"?t("left"):current.foot==="B"?"Both":current.foot==="R"?t("right"):"—";
  if(!keepTab) tab="ov";
  setTab(tab); renderAll(); updateCompareBar();
  if(!keepTab) window.scrollTo(0,0);
}

function renderAll(){
  const p = current;
  $("p-ov").innerHTML = `
    <p style="color:var(--muted);line-height:1.6;font-size:14px">${t("cardRating")(p)}</p>
    <div class="section-title" style="padding:16px 0 8px">${t("bestSkills")}</div>
    <div class="skills">${p.skills.map((s,i)=>`<span class="skill ${p.gold.includes(i)?'gold':''}">${s}</span>`).join("")}</div>
    <button class="btn" id="addCmp">${compare.has(p.id)?t("removeCompare"):t("addCompare")}</button>`;
  $("addCmp").onclick = () => {
    if(compare.has(p.id)) compare.delete(p.id);
    else { if(compare.size>=3){alert(t("maxThree")); return;} compare.add(p.id); }
    updateCompareBar(); renderAll();
  };

  $("p-at").innerHTML = Object.entries(ATTR_GROUPS).map(([g,keys]) => `
    <div class="attr-group"><h3>${txt(ATTR_LABELS[g])}</h3>
      ${keys.map(k => { const v=p.attrs[k]??0; return `
        <div class="attr"><span class="lab">${attrLabel(k)}</span>
          <div class="bar"><i style="width:${Math.min(v,100)}%;background:${barColor(v)}"></i></div>
          <span class="val">${v}</span></div>`; }).join("")}
    </div>`).join("");

  $("p-sk").innerHTML = `<div class="skills">${p.skills.map((s,i)=>`<span class="skill ${p.gold.includes(i)?'gold':''}">${s}</span>`).join("")}</div>
    <p class="note">${t("goldNote")}</p>`;

  $("p-ps").innerHTML = `
    <div class="pos-grid">${Object.entries(p.positions).map(([k,v])=>
      `<div class="pcell">${k}<b style="color:${barColor(v)}">${v}</b></div>`).join("")}</div>
    <p class="note">${t("posNote")}</p>`;

  renderBuilds();
}

function renderBuilds(){
  const score = b => b.votes + (votes[b.key]?1:0);
  const list = (BUILDS[current.id]||[]).map(b=>({...b,key:txt(b.title)+current.id})).sort((a,b)=>score(b)-score(a));
  $("p-bd").innerHTML = `
    <div class="section-title" style="padding:0 0 10px">${t("buildsTitle")}</div>
    ${list.map(b=>{ const on=!!votes[b.key];
      return `<div class="build"><div class="top"><div><h4>${txt(b.title)}</h4><small>${b.by} · ${txt(b.desc)}</small></div>
      <button class="vote ${on?'on':''}" data-k="${b.key}">▲ ${score(b)}</button></div></div>`; }).join("")||`<p class="empty">${t("noBuilds")}</p>`}
    <button class="btn ghost" id="newBuild">${t("newBuild")}</button>`;
  document.querySelectorAll(".vote").forEach(b => b.onclick = () => { votes[b.dataset.k]=!votes[b.dataset.k]; renderBuilds(); });
  $("newBuild").onclick = () => alert(t("protoAlert"));
}

function setTab(tb){
  tab = tb;
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x.dataset.t===tb));
  ["ov","at","sk","ps","bd"].forEach(k => $("p-"+k).style.display = k===tb?"block":"none");
}

function renderCompare(){
  const ps = PLAYERS.filter(p=>compare.has(p.id));
  const keys = Object.values(ATTR_GROUPS).flat();
  $("cmpTable").innerHTML = `<tr><th>${t("feature")}</th>${ps.map(p=>`<th>${p.name}</th>`).join("")}</tr>
    <tr><td>${t("cardRow")}</td>${ps.map(p=>`<td><b>${p.ovr}</b></td>`).join("")}</tr>
    <tr><td>${t("posRow")}</td>${ps.map(p=>`<td>${p.pos}</td>`).join("")}</tr>
    ${keys.map(k=>`<tr><td>${attrLabel(k)}</td>${ps.map(p=>`<td>${p.attrs[k]}</td>`).join("")}</tr>`).join("")}`;
}

// ---- Events ----
$("q").oninput = e => { query = e.target.value; renderGrid(); };
$("backBtn").onclick = showList;
$("tabs").onclick = e => { if(e.target.dataset.t) setTab(e.target.dataset.t); };
document.querySelectorAll(".lang button").forEach(b => b.onclick = () => { lang = b.dataset.lang; applyStatic(); if(screenIsCompare()) { $("title").textContent=t("compareTitle"); renderCompare(); } });
$("cGo").onclick = () => {
  if(compare.size<2){ alert(t("minTwo")); return; }
  renderCompare();
  ["list","detail"].forEach(id=>$(id).style.display="none");
  $("compareView").style.display="block"; $("backBtn").style.display="inline"; $("title").textContent=t("compareTitle");
  $("cbar").style.display="none";
};
$("closeCmp").onclick = showList;


const SUPABASE_URL = "https://zaqdudfatgtvlyoigpnn.supabase.co";
const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_PpZyM0icC-fRSeU9lUkjIg_fH4wLqvJ";
async function connectPlayerDatabase(){
  const url=$("sbUrl").value.trim()||SUPABASE_URL;
  const key=$("sbKey").value.trim()||SUPABASE_PUBLISHABLE_KEY;
  const status=$("dbStatus");
  if(!window.supabase?.createClient){ status.textContent="Database library load হয়নি। ইন্টারনেট সংযোগ পরীক্ষা করুন।"; return; }
  status.textContent="Connecting…";
  try{
    const client=window.supabase.createClient(url,key);
    const results=await Promise.all([
      client.from("players").select("player_id,name,position,overall,card_type,payload").eq("published",true).order("overall",{ascending:false}),
      client.from("player_identities").select("konami_id,name,position,country,payload").eq("published",true).order("name"),
      client.from("managers").select("manager_id,name,team,formation,playstyle,payload").eq("published",true).order("name")
    ]);
    for(const result of results){ if(result.error) throw result.error; }
    const cards=results[0].data||[], identities=results[1].data||[], managers=results[2].data||[];
    const identityById=new Map(identities.map(x=>[String(x.konami_id),x]));
    const num=(...values)=>{ for(const v of values){ if(typeof v==="number"&&Number.isFinite(v)) return v; if(typeof v==="string"){ const n=parseInt(v,10); if(Number.isFinite(n)) return n; } } return 0; };
    const cardRows=cards.map((r,i)=>{
      const p=r.payload||{}, identity=identityById.get(String(r.player_id))||{}, details=identity.payload||{};
      const attrs=Object.fromEntries(Object.values(ATTR_GROUPS).flat().map(k=>[k,"—"]));
      Object.assign(attrs,p.attributes||p.attrs||{});
      return {id:i+1,name:r.name||p.name||identity.name||"Unknown player",club:p.team||details.team||"",pos:r.position||identity.position||"—",
        ovr:r.overall??p.overall??p.ovr??"—",max:p.max_overall??p.max??r.overall??"—",tier:r.card_type||"eFootball",
        h:num(p.height_cm,p.height,details.height),w:num(p.weight_kg,p.weight,details.weight),age:num(p.age,details.age),
        foot:(p.foot||details.foot)==="Left"?"L":(p.foot||details.foot)==="Both"?"B":(p.foot||details.foot)==="Right"?"R":"",
        playstyle:p.playstyle||"",attrs:attrs,skills:Array.isArray(p.skills)?p.skills:[],gold:Array.isArray(p.gold)?p.gold:[],positions:p.positions||p.position_ratings||{}};
    });
    const identityRows=identities.map((r,i)=>{
      const p=r.payload||{};
      const attrs=Object.fromEntries(Object.values(ATTR_GROUPS).flat().map(k=>[k,"—"]));
      return {id:i+1,name:r.name||p.name||"Unknown player",club:p.team||"",pos:r.position||p.pos||"—",ovr:"—",max:"—",tier:"Player",
        h:num(p.height_cm,p.height),w:num(p.weight_kg,p.weight),age:num(p.age),foot:p.foot==="Left"?"L":p.foot==="Both"?"B":p.foot==="Right"?"R":"",
        playstyle:"",attrs:attrs,skills:[],gold:[],positions:{}};
    });
    MANAGERS=managers.map(m=>{ const p=m.payload||{}; return Object.assign({},m,{nationality:p.nationality||"",attacking_playstyle:m.playstyle||p.attacking_playstyle||p.playstyle||"",build_up:p.build_up||p.buildUp||"",defensive_playstyle:p.defensive_playstyle||p.defensivePlaystyle||""}); });
    PLAYERS=cardRows.length?cardRows:identityRows;
    compare.clear(); current=null; showList(); renderManagers();
    status.textContent=cardRows.length?"Connected: "+cardRows.length+" player cards, "+identities.length+" identities, "+MANAGERS.length+" managers.":"Connected: "+identities.length+" player identities and "+MANAGERS.length+" managers. Card ratings and detailed game stats are not yet in the database.";
    localStorage.setItem("zone_sb_url",url); $("sbKey").value="";
  }catch(e){ status.textContent="Connection failed: "+(e.message||"Check publishable key, table permissions and RLS."); }
}
function escapeHTML(value){return String(value??"").replace(/[&<>"\x27]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","\x27":"&#39;"}[ch]));}
function renderManagers(){
  const grid=$("managerGrid");
  grid.innerHTML=MANAGERS.map(m=>`<article class="card" style="padding:16px"><div class="name">${escapeHTML(m.name)}</div><div class="club">${escapeHTML(m.team||m.nationality||"")}</div><div style="margin-top:10px">Formation: ${escapeHTML(m.formation||"Not recorded")}</div><div>Attack: ${escapeHTML(m.attacking_playstyle||"Not recorded")}</div><div>Build up: ${escapeHTML(m.build_up||"Not recorded")}</div><div>Defence: ${escapeHTML(m.defensive_playstyle||"Not recorded")}</div></article>`).join("");
  $("managerEmpty").style.display=MANAGERS.length?"none":"block";
}
function showPlayersTab(){ $("playerContent").style.display="block"; $("managerContent").style.display="none"; $("playersTab").classList.add("on"); $("managersTab").classList.remove("on"); }
function showManagersTab(){ $("playerContent").style.display="none"; $("managerContent").style.display="block"; $("managersTab").classList.add("on"); $("playersTab").classList.remove("on"); renderManagers(); }
$("playersTab").onclick=showPlayersTab; $("managersTab").onclick=showManagersTab;
$("connectDb").onclick=connectPlayerDatabase;
$("sbUrl").value=localStorage.getItem("zone_sb_url")||SUPABASE_URL;
// API keys are intentionally not restored from localStorage.
localStorage.removeItem("zone_sb_key");
$("sbKey").value="";

applyStatic();
connectPlayerDatabase();
</script>
</body>
</html>
