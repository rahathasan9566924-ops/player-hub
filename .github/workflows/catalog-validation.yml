name: Catalog validation

on:
  push:
    paths:
      - 'index.html'
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/catalog-validation.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'data/**'
      - '.github/workflows/catalog-validation.yml'

jobs:
  validate-catalog-tooling:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check Player Hub inline JavaScript
        run: node scripts/check-html.mjs
      - name: Run catalog tooling tests
        run: node --test scripts/validate-catalog.test.mjs scripts/prepare-supabase-import.test.mjs
